<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Link Downloader</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>


<body>

<div class="glass-card">

    <h1>Link Downloader</h1>

    <p class="description">
        Paste a link below to download your media.
    </p>


    <form method="POST" action="/download">

        <input
            type="text"
            name="url"
            placeholder="Paste your link here"
            required
        >


        <select name="quality">

            <option value="best">
                Best Quality
            </option>

            <option value="1080">
                1080p
            </option>

            <option value="720">
                720p
            </option>

            <option value="480">
                480p
            </option>

        </select>


        <select name="download_type">

            <option value="video">
                Video
            </option>

            <option value="audio">
                Audio Only
            </option>

        </select>


        <button type="submit">
            Download
        </button>

    </form>


    <!-- IRON MAN LOADING ANIMATION -->

    <div
        id="helmet-loader"
        class="helmet-loader"
    >

        <svg
            class="ironman-helmet"
            viewBox="0 0 200 220"
        >

            <!-- COLOR GRADIENTS -->

            <defs>

                <linearGradient
                    id="shell-red"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1"
                >
                    <stop
                        offset="0%"
                        stop-color="#b51f1f"
                    />

                    <stop
                        offset="55%"
                        stop-color="#7a0f0f"
                    />

                    <stop
                        offset="100%"
                        stop-color="#3d0505"
                    />

                </linearGradient>


                <linearGradient
                    id="face-gold"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1"
                >

                    <stop
                        offset="0%"
                        stop-color="#ffe08a"
                    />

                    <stop
                        offset="50%"
                        stop-color="#d6a21f"
                    />

                    <stop
                        offset="100%"
                        stop-color="#8f6410"
                    />

                </linearGradient>

            </defs>


            <!-- OUTER HELMET -->

            <path
                class="helmet-shell"
                d="
                    M35 48
                    L62 18
                    H138
                    L165 48
                    L176 128
                    L150 188
                    L125 210
                    H75
                    L50 188
                    L24 128
                    Z
                "
            />


            <!-- SIDE ARMOR -->

            <path
                class="helmet-side"
                d="
                    M35 60
                    L52 75
                    L48 150
                    L62 190
                    L48 178
                    L28 128
                    Z
                "
            />


            <path
                class="helmet-side"
                d="
                    M165 60
                    L148 75
                    L152 150
                    L138 190
                    L152 178
                    L172 128
                    Z
                "
            />


            <!-- DARK INTERIOR -->

            <path
                class="helmet-inner"
                d="
                    M58 58
                    H142
                    L148 118
                    L125 170
                    H75
                    L52 118
                    Z
                "
            />


            <!-- MOVING FACEPLATE -->

            <g class="faceplate-group">

                <path
                    class="helmet-faceplate"
                    d="
                        M58 52
                        L75 38
                        H125
                        L142 52
                        L150 112
                        L128 165
                        L100 185
                        L72 165
                        L50 112
                        Z
                    "
                />


                <!-- FOREHEAD DETAIL -->

                <path
                    class="faceplate-detail"
                    d="
                        M76 50
                        L100 42
                        L124 50
                        L118 68
                        H82
                        Z
                    "
                />


                <!-- LEFT EYE -->

                <path
                    class="helmet-eye"
                    d="
                        M55 96
                        L91 101
                        L84 113
                        L58 108
                        Z
                    "
                />


                <!-- RIGHT EYE -->

                <path
                    class="helmet-eye"
                    d="
                        M145 96
                        L109 101
                        L116 113
                        L142 108
                        Z
                    "
                />


                <!-- MOUTH / LOWER PANEL DETAIL -->

                <path
                    class="faceplate-line"
                    d="
                        M78 145
                        L100 153
                        L122 145
                    "
                />

            </g>

        </svg>


        <p
            id="helmet-status"
            class="helmet-status"
        >
            Finding media...
        </p>

    </div>

</div>


<script
    src="{{ url_for('static', filename='script.js') }}"
></script>

</body>

</html>
